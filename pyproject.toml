[project]
name = "mcp-sql-server"
version = "0.1.0"
description = "An MCP server exposing a business database to an AI agent behind a policy-enforced access layer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0,<2.0",
    "pyyaml>=6.0",
    "sqlglot>=25.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
